# ---- Phase 2F Step 12: InsightForge production-style local stack ----
#
# Services: PostgreSQL, FastAPI backend, Next.js frontend, Qdrant (vector store).
# - All services share one internal network; only backend:8000 and
#   frontend:3000 are published to the host.
# - PostgreSQL + Qdrant data are persisted in named volumes and survive
#   container recreation.
# - Secrets/credentials come from the environment (Compose interpolates
#   `${POSTGRES_*}`; API keys via `env_file: .env`) — never hardcoded here.
# - The backend reaches PostgreSQL through DATABASE_URL (the `postgres`
#   service on the compose network) and Qdrant through QDRANT_URL.
name: insightforge

services:
  postgres:
    image: postgres:16-alpine # pinned — never `latest`
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightforge}
      POSTGRES_DB: ${POSTGRES_DB:-insightforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightforge} -d ${POSTGRES_DB:-insightforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432" # internal only — the backend talks to it on the network
    networks:
      - insightforge-net

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    expose:
      - "6333" # internal only — the backend talks to it on the network
    networks:
      - insightforge-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Qdrant runs as a service on the compose network (remote mode); the
      # Step 10 vector-store implementation already supports QDRANT_URL.
      QDRANT_URL: http://qdrant:6333
      # PostgreSQL runs as the `postgres` service on the compose network.
      # Credentials come from the environment (see POSTGRES_* above).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-insightforge}:${POSTGRES_PASSWORD:-insightforge}@postgres:5432/${POSTGRES_DB:-insightforge}
    ports:
      - "8000:8000" # browser + frontend reach the API here
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - insightforge-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Public-only: the browser calls the backend through the published
        # host port. This is the ONLY variable the frontend receives — no
        # server secrets (API keys, DB credentials) are ever passed to it.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000" # browser
    depends_on:
      - backend
    networks:
      - insightforge-net

networks:
  insightforge-net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_storage:
