# CI — validate every change to v2-fullstack (Phase 2F Step 16)
#
# Runs on pull requests to and pushes on v2-fullstack:
#   · backend test suite (pytest)
#   · frontend lint + production build
#   · production Docker image builds (backend + frontend)
# The workflow fails if any step fails.
name: CI

on:
  pull_request:
    branches: [v2-fullstack]
  push:
    branches: [v2-fullstack]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        run: pytest -q

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Build (production)
        run: npm run build
        working-directory: frontend

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production images (backend + frontend)
        # Builds the images the Compose stack uses. No registry push (the
        # single-server deploy builds on the server). Compose interpolation
        # falls back to dev defaults for build-time vars; secrets are never
        # needed to build.
        run: docker compose build backend frontend
