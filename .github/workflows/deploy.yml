# CD — deploy v2-fullstack to the single production server (Phase 2F Step 16)
#
# On a push to v2-fullstack (or manual run), SSH into the production server
# and run the versioned `deploy/deploy.sh`, which:
#   · checks out the requested commit
#   · builds the backend + frontend images
#   · recreates the services (volumes preserved — never `down -v`)
#   · applies Alembic migrations (idempotent)
#   · verifies backend /health and frontend responses (fails deploy otherwise)
#   · records the deployed commit (rollback reference)
#
# Production secrets live in GitHub repository secrets — never in Git and
# never printed to logs.
name: Deploy

on:
  push:
    branches: [v2-fullstack]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            export DEPLOY_COMMIT="${{ github.sha }}"
            export DOMAIN="${{ secrets.DOMAIN }}"
            cd "${{ secrets.DEPLOY_DIR }}"
            bash deploy/deploy.sh
