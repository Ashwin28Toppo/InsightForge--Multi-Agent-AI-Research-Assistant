[alembic]
# Path to the migration environment and versions directory.
# %(here)s = the directory containing this file (backend/).
script_location = %(here)s/alembic
prepend_sys_path = .

# The URL is normally read from DATABASE_URL (see alembic/env.py, which sets
# this value from the application settings). Leave it blank here so there is a
# single source of truth and no credentials in this file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
